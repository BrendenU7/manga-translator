<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manga Translator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>漫 <span>Manga Translator</span></h1>
    <p class="tag">Detect bubbles → OCR → LLM translation → clean → typeset</p>
  </header>

  <main>
    <section id="upload-panel" class="card">
      <label id="dropzone" for="file-input">
        <input id="file-input" type="file" accept="image/png,image/jpeg,image/webp,image/gif,image/bmp" hidden>
        <strong>Drop a page here</strong> or click to browse
        <small>PNG, JPG, WebP · one page at a time</small>
      </label>
      <div class="controls">
        <label>From <select id="source-lang"></select></label>
        <label>To <select id="target-lang"></select></label>
        <button id="translate-btn" disabled>Translate</button>
      </div>
      <p id="mode-note" class="note" hidden></p>
    </section>

    <section id="progress-panel" class="card" hidden>
      <ol id="stages">
        <li data-stage="detecting">Detect bubbles</li>
        <li data-stage="reading">Read text</li>
        <li data-stage="translating">Translate</li>
        <li data-stage="cleaning">Erase text</li>
        <li data-stage="typesetting">Typeset</li>
      </ol>
      <p id="error" class="error" hidden></p>
    </section>

    <section id="result-panel" hidden>
      <div class="toolbar">
        <div class="seg">
          <button data-view="side" class="active">Side by side</button>
          <button data-view="translated">Translated</button>
          <button data-view="original">Original</button>
        </div>
        <a id="download" class="button" download>Download PNG</a>
      </div>
      <div id="viewer" class="side">
        <figure class="orig"><img id="img-original" alt="Original page"><figcaption>Original</figcaption></figure>
        <figure class="trans"><img id="img-translated" alt="Translated page"><figcaption>Translated</figcaption></figure>
      </div>

      <div class="card">
        <h2>Edit translations</h2>
        <p class="note">Fix any line, then re-render. Only the typesetting step re-runs.</p>
        <div id="bubbles"></div>
        <button id="rerender-btn">Re-render page</button>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
